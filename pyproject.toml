[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-recipe-starter"
version = "0.1.0"
description = "Example OpenRewrite Python recipes and tests to help you get started"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["openrewrite", "moderne", "recipe", "refactoring", "python", "codemods", "lst"]
# The host that runs the recipes provides openrewrite, so it is not a runtime dependency.
# The dev extra installs it for writing and testing recipes.
dependencies = []

[project.optional-dependencies]
dev = [
    "openrewrite>=8.93,<9",
    "pytest>=8.0.0",
    "ruff>=0.17",
    "ty>=0.0.90",
]

[project.urls]
Homepage = "https://docs.moderne.io/"
Repository = "https://github.com/moderneinc/python-recipe-starter"

# The Moderne CLI discovers the recipes in this package through this entry point.
[project.entry-points."openrewrite.recipes"]
python-recipe-starter = "python_recipe_starter:activate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
